<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Audiobook Library</title>
</head>
<body>
    <div id="AudiobookLibraryConfigPage" data-role="page" class="page type-interior pluginConfigurationPage" data-require="emby-button,emby-input,emby-select,emby-checkbox" data-controller="__plugin/AudiobookLibraryAdmin.js">
        <style>
            #AudiobookLibraryConfigPage .abl-row { display: flex; flex-wrap: wrap; gap: 0.75em; align-items: flex-end; margin: 0.5em 0; }
            #AudiobookLibraryConfigPage .abl-row label { display: flex; flex-direction: column; gap: 0.25em; font-size: 0.9em; }
            #AudiobookLibraryConfigPage input, #AudiobookLibraryConfigPage select { padding: 0.4em 0.5em; font: inherit; }
            #AudiobookLibraryConfigPage .abl-narrow { width: 6em; }
            #AudiobookLibraryConfigPage .abl-asin { width: 9em; font-family: monospace; }
            #AudiobookLibraryConfigPage .abl-book { border-top: 1px solid rgba(128, 128, 128, 0.3); padding: 0.4em 0; }
            #AudiobookLibraryConfigPage .abl-book-head { display: flex; gap: 0.75em; align-items: center; cursor: pointer; }
            #AudiobookLibraryConfigPage .abl-book-head .abl-name { flex: 1; min-width: 0; }
            #AudiobookLibraryConfigPage .abl-muted { opacity: 0.7; font-size: 0.9em; }
            #AudiobookLibraryConfigPage .abl-file { display: flex; gap: 0.75em; align-items: center; padding: 0.3em 0 0.3em 1.5em; flex-wrap: wrap; }
            #AudiobookLibraryConfigPage .abl-file .abl-name { flex: 1; min-width: 12em; overflow-wrap: anywhere; }
            #AudiobookLibraryConfigPage .abl-pill { border-radius: 1em; padding: 0.1em 0.7em; font-size: 0.85em; white-space: nowrap; border: 1px solid currentColor; }
            #AudiobookLibraryConfigPage .abl-pill-NoChapters { color: #e0a030; }
            #AudiobookLibraryConfigPage .abl-pill-NeedsReview { color: #e05050; }
            #AudiobookLibraryConfigPage .abl-pill-Audible, #AudiobookLibraryConfigPage .abl-pill-Silence { color: #40b070; }
            #AudiobookLibraryConfigPage .abl-pill-Embedded { color: #60a0e0; }
            #AudiobookLibraryConfigPage .abl-pill-NotSupported { opacity: 0.6; }
            #AudiobookLibraryConfigPage .abl-detail { margin: 0.5em 0 1em 1.5em; padding: 1em; border-radius: 0.5em; background: rgba(128, 128, 128, 0.12); }
            #AudiobookLibraryConfigPage .abl-detail h3 { margin: 0 0 0.25em; }
            #AudiobookLibraryConfigPage .abl-section { margin-top: 1em; }
            #AudiobookLibraryConfigPage .abl-error { color: #e05050; margin: 0.3em 0; }
            #AudiobookLibraryConfigPage .abl-warning { color: #e0a030; margin: 0.3em 0; }
            #AudiobookLibraryConfigPage .abl-chapters { max-height: 24em; overflow-y: auto; margin: 0.5em 0; padding: 0; list-style: none; }
            #AudiobookLibraryConfigPage .abl-chapters li { display: flex; gap: 0.75em; align-items: center; padding: 0.15em 0; }
            #AudiobookLibraryConfigPage .abl-chapters .abl-time { font-family: monospace; min-width: 6em; }
            #AudiobookLibraryConfigPage .abl-chapters .abl-title { flex: 1; }
            #AudiobookLibraryConfigPage .abl-x { background: none; border: none; color: inherit; cursor: pointer; font-size: 1.1em; padding: 0 0.4em; }
            #AudiobookLibraryConfigPage .abl-filters button.abl-on { outline: 2px solid currentColor; }
        </style>
        <div data-role="content">
            <div class="content-primary">
                <h2 class="sectionTitle">Audiobook Library</h2>

                <div class="verticalSection">
                    <h3 class="sectionTitle">Settings</h3>
                    <form class="abl-settings abl-row">
                        <label>Audible store <select class="abl-setting-region"></select></label>
                        <label>Silence quieter than (dB) <input class="abl-setting-noise abl-narrow" type="number" min="-80" max="-10" step="1"></label>
                        <label>Silence at least (s) <input class="abl-setting-min abl-narrow" type="number" min="1" max="30" step="0.5"></label>
                        <button is="emby-button" type="submit" class="raised button-submit emby-button"><span>Save</span></button>
                    </form>
                </div>

                <div class="verticalSection">
                    <h3 class="sectionTitle">Books</h3>
                    <div class="abl-row">
                        <input class="abl-search" type="search" placeholder="Search title or author" style="flex: 1; min-width: 14em;">
                        <div class="abl-filters abl-row" style="margin: 0;">
                            <button type="button" class="raised emby-button abl-on" data-filter="all">All</button>
                            <button type="button" class="raised emby-button" data-filter="NoChapters">No chapters</button>
                            <button type="button" class="raised emby-button" data-filter="NeedsReview">Needs review</button>
                        </div>
                    </div>
                    <p class="abl-list-status abl-muted">Loading...</p>
                    <div class="abl-books"></div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
