framework: "net10.0"
overview: "Chapter-aware audiobook player for Jellyfin's web client and apps"
description: >
  Plays audiobooks in a chapter-aware player styled after Audiobookshelf's. The
  now-playing bar shows chapter marks and the current chapter, with chapter skip,
  10-second skips, speed and a chapter list. On phones, tapping the bar opens a
  full-page player. Playback speed is remembered for each book and each user.
  Admins can add chapters to books from Audible or from silences.
category: "General"
owner: "tmorrell"
artifacts:
- "Jellyfin.Plugin.AudiobookLibrary.dll"
# Update before every tag, the release workflow refuses a changelog that any earlier version already used
changelog: >
  Adds chapter tools for audiobooks without good chapters, on the plugin's
  admin page. Match a file to its Audible book by ASIN to get Audible's chapter
  list, or detect chapter breaks from long silences with Jellyfin's own ffmpeg.
  Review the preview, remove any wrong marks, and apply. Chapters are written
  into M4B files without re-encoding, the new file is checked against the
  original before it replaces it, and the original is kept as a .bak that can
  be restored from the page. MP3 books can store an ASIN, chapter tools for
  them come later.
