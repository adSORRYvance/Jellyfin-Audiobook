description: >
  Plays audiobooks in a chapter-aware player styled after Audiobookshelf's. The
  now-playing bar shows chapter marks and the current chapter, with chapter skip,
  10-second skips, speed and a chapter list. On phones, tapping the bar opens a
  full-page player.
