# Update before every tag, the release workflow refuses a changelog that any earlier version already used
changelog: >
  Books split over several files, like a folder of MP3 chapters, GraphicAudio
  parts or a book in two M4Bs, now play as one book. The bar, skips, chapter
  buttons and chapter list cover the whole book, the next file starts on its
  own, and skips and seeks that cross into another file land in the right
  place. Each user's place in a split book is saved, so it reopens where they
  left off on any device, even when Jellyfin starts a different file. Also
  fixes Jellyfin's own now-playing bar staying on screen with its buttons
  pushed out of view after a book stopped.
