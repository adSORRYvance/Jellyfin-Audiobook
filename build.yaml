# Update before every tag, the release workflow refuses a changelog that any earlier version already used
changelog: >
  Adds silence detection for books without chapters. The server scans a file
  with Jellyfin's own ffmpeg in the background and suggests chapter breaks from
  long pauses. Nothing uses it yet; the admin page for reviewing and applying
  chapters arrives in a later release.
