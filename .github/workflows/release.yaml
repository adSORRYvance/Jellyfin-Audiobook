# Pushing a tag like v0.1.0.0 builds the plugin zip, attaches it to a GitHub Release, and adds that version to manifest.json on main
name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

# Two tags pushed together would both try to push manifest.json, so run releases one at a time
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out tagged commit
        uses: actions/checkout@v4
        with:
          path: src

      # Separate checkout because JPRM rewrites Directory.Build.props in src, and that edit must never reach main
      - name: Check out main for the manifest
        uses: actions/checkout@v4
        with:
          ref: main
          path: repo

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install JPRM
        run: pip install jprm

      # Each version keeps its changelog in the plugin catalog for good, so stop before anything is published if it wasn't updated
      # Comparing against every version already in manifest.json catches a changelog left over from any earlier release
      # PyYAML comes with JPRM
      - name: Check changelog was updated
        run: |
          python - <<'EOF'
          import json, sys, yaml

          with open("src/build.yaml") as f:
              changelog = ((yaml.safe_load(f) or {}).get("changelog") or "").strip()

          with open("repo/manifest.json") as f:
              plugins = json.load(f)

          # GitHub reads ::error:: lines from stdout, so print first and then exit
          if not changelog:
              print("::error::build.yaml has no changelog")
              sys.exit(1)

          for plugin in plugins:
              for version in plugin.get("versions", []):
                  if (version.get("changelog") or "").strip() == changelog:
                      print(f"::error::build.yaml changelog is the same as {version['version']}'s. "
                            "Update it, delete this tag, and tag again")
                      sys.exit(1)

          print("Changelog is new")
          EOF

      - name: Build plugin zip
        id: build
        working-directory: src
        run: |
          version="${GITHUB_REF_NAME#v}"
          # JPRM writes the zip straight into --output and fails if the folder isn't there yet
          mkdir -p "$RUNNER_TEMP/artifacts"
          zip="$(jprm --verbosity=debug plugin build . --version="$version" --output="$RUNNER_TEMP/artifacts")"
          echo "zip=$zip" >> "$GITHUB_OUTPUT"
          echo "name=$(basename "$zip")" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        working-directory: src
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "${{ steps.build.outputs.zip }}" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes

      # --plugin-url points the manifest at the release asset, so JPRM doesn't copy the zip into the repo
      - name: Add version to manifest.json
        working-directory: repo
        run: |
          url="https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/${{ steps.build.outputs.name }}"
          jprm --verbosity=debug repo add --plugin-url "$url" . "${{ steps.build.outputs.zip }}"

      - name: Push manifest.json
        working-directory: repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add manifest.json
          git commit -m "Add ${GITHUB_REF_NAME} to manifest.json"
          git push origin main
