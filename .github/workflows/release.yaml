# Pushing a version tag publishes a build that already passed its checklist on the test server (scripts/deploy-test.sh)
# vA.B.C.D-beta is a pre-release and only goes into manifest-beta.json
# vA.B.C.D is stable and goes into both manifests, and when that version is already in beta it promotes the exact beta zip
name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

# Two tags pushed together would both try to push the manifests, so run releases one at a time
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      # Anything that isn't one of the two tag shapes stops here, before a typo gets published
      - name: Read tag
        id: tag
        run: |
          if [[ "$GITHUB_REF_NAME" =~ ^v([0-9]+\.[0-9]+\.[0-9]+\.[0-9]+)-beta$ ]]; then
            channel=beta
          elif [[ "$GITHUB_REF_NAME" =~ ^v([0-9]+\.[0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            channel=stable
          else
            echo "::error::Tag $GITHUB_REF_NAME must be vA.B.C.D-beta or vA.B.C.D"
            exit 1
          fi
          version="${BASH_REMATCH[1]}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "channel=$channel" >> "$GITHUB_OUTPUT"
          echo "$GITHUB_REF_NAME is version $version on the $channel channel"

      - name: Check out tagged commit
        uses: actions/checkout@v4
        with:
          path: src

      # Separate checkout because JPRM rewrites Directory.Build.props in src, and that edit must never reach main
      - name: Check out main for the manifests
        uses: actions/checkout@v4
        with:
          ref: main
          path: repo

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install JPRM
        run: pip install jprm

      # A stable tag for a version already in beta is a promotion, the same build moves to stable users
      # Publishing a version twice on one channel, or going from stable back to beta, is refused
      - name: Decide release kind
        id: kind
        env:
          VERSION: ${{ steps.tag.outputs.version }}
          CHANNEL: ${{ steps.tag.outputs.channel }}
        run: |
          python - <<'EOF'
          import json, os, sys

          version, channel = os.environ["VERSION"], os.environ["CHANNEL"]

          def entry(path):
              with open(path) as f:
                  for plugin in json.load(f):
                      for v in plugin.get("versions", []):
                          if v["version"] == version:
                              return v
              return None

          in_stable = entry("repo/manifest.json")
          in_beta = entry("repo/manifest-beta.json")

          # GitHub reads ::error:: lines from stdout, so print first and then exit
          if in_stable:
              print(f"::error::{version} is already a stable release")
              sys.exit(1)
          if channel == "beta" and in_beta:
              print(f"::error::{version} is already in beta. Test the next version and tag that instead")
              sys.exit(1)

          promotion = channel == "stable" and in_beta is not None
          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              out.write(f"promotion={'true' if promotion else 'false'}\n")
              if promotion:
                  out.write(f"checksum={in_beta['checksum']}\n")

          print(f"Promoting beta {version} to stable" if promotion else f"New {channel} release {version}")
          EOF

      # Each version keeps its changelog in the plugin catalog for good, so stop before anything is published if it wasn't updated
      # Both manifests are checked, since a beta changelog reused on a later release would otherwise slip through
      # PyYAML comes with JPRM
      - name: Check changelog was updated
        if: steps.kind.outputs.promotion == 'false'
        run: |
          python - <<'EOF'
          import json, sys, yaml

          with open("src/build.yaml") as f:
              changelog = ((yaml.safe_load(f) or {}).get("changelog") or "").strip()

          if not changelog:
              print("::error::build.yaml has no changelog")
              sys.exit(1)

          for manifest in ("repo/manifest.json", "repo/manifest-beta.json"):
              with open(manifest) as f:
                  plugins = json.load(f)

              for plugin in plugins:
                  for version in plugin.get("versions", []):
                      if (version.get("changelog") or "").strip() == changelog:
                          print(f"::error::build.yaml changelog is the same as {version['version']}'s. "
                                "Update it, delete this tag, and tag again")
                          sys.exit(1)

          print("Changelog is new")
          EOF

      - name: Build plugin zip
        id: build
        if: steps.kind.outputs.promotion == 'false'
        working-directory: src
        run: |
          # JPRM writes the zip straight into --output and fails if the folder isn't there yet
          mkdir -p "$RUNNER_TEMP/artifacts"
          zip="$(jprm --verbosity=debug plugin build . --version="${{ steps.tag.outputs.version }}" --output="$RUNNER_TEMP/artifacts")"
          echo "zip=$zip" >> "$GITHUB_OUTPUT"

      # The checksum check proves stable users get the very zip beta users ran
      - name: Fetch the beta zip
        id: promote
        if: steps.kind.outputs.promotion == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/artifacts"
          gh release download "v${{ steps.tag.outputs.version }}-beta" \
            --repo "$GITHUB_REPOSITORY" --pattern '*.zip' --dir "$RUNNER_TEMP/artifacts"
          zip="$(ls "$RUNNER_TEMP"/artifacts/*.zip)"
          actual="$(md5sum "$zip" | cut -d' ' -f1)"
          if [ "$actual" != "${{ steps.kind.outputs.checksum }}" ]; then
            echo "::error::Beta zip checksum $actual doesn't match manifest-beta.json"
            exit 1
          fi
          echo "zip=$zip" >> "$GITHUB_OUTPUT"

      # Beta releases are marked pre-release so the repo's Latest release keeps pointing at stable
      - name: Create GitHub Release
        id: release
        working-directory: src
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          zip="${{ steps.build.outputs.zip || steps.promote.outputs.zip }}"
          flags=(--title "$GITHUB_REF_NAME")
          if [ "${{ steps.tag.outputs.channel }}" = beta ]; then
            flags+=(--prerelease --generate-notes)
          elif [ "${{ steps.kind.outputs.promotion }}" = true ]; then
            flags+=(--notes "Promotes v${{ steps.tag.outputs.version }}-beta to stable. Same build, no changes.")
          else
            flags+=(--generate-notes)
          fi
          gh release create "$GITHUB_REF_NAME" "$zip" "${flags[@]}"
          echo "zip=$zip" >> "$GITHUB_OUTPUT"
          echo "name=$(basename "$zip")" >> "$GITHUB_OUTPUT"

      # --plugin-url points the manifest at this release's asset, so JPRM doesn't copy the zip into the repo
      # JPRM needs a folder in front of a custom manifest name, a bare manifest-beta.json fails
      # The beta manifest gets every new release, a promotion is already there
      - name: Add version to the manifests
        id: manifests
        working-directory: repo
        run: |
          url="https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/${{ steps.release.outputs.name }}"
          zip="${{ steps.release.outputs.zip }}"
          files=()
          if [ "${{ steps.kind.outputs.promotion }}" = false ]; then
            jprm --verbosity=debug repo add --plugin-url "$url" ./manifest-beta.json "$zip"
            files+=(manifest-beta.json)
          fi
          if [ "${{ steps.tag.outputs.channel }}" = stable ]; then
            jprm --verbosity=debug repo add --plugin-url "$url" ./manifest.json "$zip"
            files+=(manifest.json)
          fi
          echo "files=${files[*]}" >> "$GITHUB_OUTPUT"

      - name: Push the manifests
        working-directory: repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add manifest.json manifest-beta.json
          git commit -m "Add ${GITHUB_REF_NAME} to ${{ steps.manifests.outputs.files }}"
          git push origin main
