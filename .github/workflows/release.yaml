# Pushing a tag like v0.1.0.0 builds the plugin zip, attaches it to a GitHub Release, and adds that version to manifest.json on main
name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

# Two tags pushed together would both try to push manifest.json, so run releases one at a time
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out tagged commit
        uses: actions/checkout@v4
        with:
          path: src

      # Separate checkout because JPRM rewrites Directory.Build.props in src, and that edit must never reach main
      - name: Check out main for the manifest
        uses: actions/checkout@v4
        with:
          ref: main
          path: repo

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install JPRM
        run: pip install jprm

      - name: Build plugin zip
        id: build
        working-directory: src
        run: |
          version="${GITHUB_REF_NAME#v}"
          zip="$(jprm --verbosity=debug plugin build . --version="$version" --output="$RUNNER_TEMP/artifacts")"
          echo "zip=$zip" >> "$GITHUB_OUTPUT"
          echo "name=$(basename "$zip")" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        working-directory: src
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "${{ steps.build.outputs.zip }}" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes

      # --plugin-url points the manifest at the release asset, so JPRM doesn't copy the zip into the repo
      - name: Add version to manifest.json
        working-directory: repo
        run: |
          url="https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/${{ steps.build.outputs.name }}"
          jprm --verbosity=debug repo add --plugin-url "$url" manifest.json "${{ steps.build.outputs.zip }}"

      - name: Push manifest.json
        working-directory: repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add manifest.json
          git commit -m "Add ${GITHUB_REF_NAME} to manifest.json"
          git push origin main
