# Builds on every push and pull request so analyzer errors show up before a release tag does
name: Build

on:
  push:
    branches:
      - '**'
    paths-ignore:
      - '**/*.md'
      - 'manifest.json'
  pull_request:
    paths-ignore:
      - '**/*.md'
      - 'manifest.json'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build
        run: dotnet build Jellyfin.Plugin.AudiobookLibrary.slnx -c Release
